[project]
name = "nmtlab"
version = "0.1.0"
description = "Local English-to-Chinese translation and analysis"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gradio==6.31.0",
    "huggingface-hub==2.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "sacrebleu==2.6.0",
    "sacremoses==0.2.0",
    "sentencepiece==0.2.2",
    "torch==2.15.0",
    "transformers==5.22.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF", "PERF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
