[model]
id = "google/madlad400-3b-mt"
revision = "fa184c675da0b5c9e1c8694fccd4e12e2d422094"
dtype = "bfloat16"
attention = "eager"
target_prefix = "<2zh>"
max_source_tokens = 512

[runtime]
device = "mps"
threads = 4

[data]
name = "FLORES-200"
url = "https://dl.fbaipublicfiles.com/nllb/flores200_dataset.tar.gz"
sha256 = "b8b0b76783024b85797e5cc75064eb83fc5288b41e9654dabc7be6ae944011f6"
split = "devtest"
source = "eng_Latn"
target = "zho_Hans"
size = 200
seed = 42

[decoding]
beams = [1, 8]
default_beams = 8
do_sample = false
max_new_tokens = 256
length_penalty = 1.0
early_stopping = false

[measurement]
seed = 42
batch_size = 1
warmup = 2
repeats = 3
length_boundaries = [15, 30]
scope = "Tokenization, device transfer, generation, and text decoding; excludes loading, warmup, attention, and plotting."

[metrics.bleu]
tokenize = "zh"
lowercase = false
smooth_method = "exp"
effective_order = false

[metrics.chrf]
char_order = 6
word_order = 0
beta = 2
lowercase = false
whitespace = false
eps_smoothing = false
